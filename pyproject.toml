[project]
name = "agentic-ai-studio"
version = "0.1.0"
description = "Agentic AI Studio — FastAPI + LangGraph chat app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openrouter>=0.2.0",
    "openrouter>=1.50.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]