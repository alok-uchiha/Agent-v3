[project]
name = "agentic-ai-studio"
version = "0.1.0"
description = "Agentic AI Studio — FastAPI + LangGraph chat app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.1.0",
    "asyncpg>=0.30.0",
    "asyncmy>=0.2.16",
    "aiosqlite>=0.12.0",
    "alembic>=1.13.3",
    "pydantic[email]>=2.9.0",
    "email-validator>=2.3.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openrouter>=0.2.9",
    "langchain-openai>=0.2.0",
    "openrouter>=0.11.46",
]

[tool.setuptools]
packages = ["api", "backend", "backend.app", "backend.app.ai", "backend.app.ai.agent", "backend.app.ai.prompt", "backend.app.ai.rag", "backend.app.api", "backend.app.api.routes", "backend.app.core", "backend.app.db", "backend.app.schemas"]

[tool.vercel]
entrypoint = "backend.app.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
