<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#e2e3e2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI Studio" />
  <link rel="manifest" href="/assets/manifest.json" />
  <title>Assistant · Agentic AI Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
  <link rel="apple-touch-icon" href="/assets/icon-180.png" />
  <link rel="stylesheet" href="/assets/styles.css?v=3" />
  <script src="/assets/app.js?v=3"></script>
</head>

<body class="chat">
  <div class="glass shell">
    <header class="topbar">
      <a class="brand" href="/">Agentic AI Studio</a>
      <div class="top-actions">
        <span class="who" id="who"></span>
        <button class="pill small" data-theme-toggle type="button"></button>
        <button class="pill small act-btn" id="new-chat" type="button" aria-label="New chat">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg><span class="lbl">New chat</span>
        </button>
        <button class="pill small act-btn" id="logout" type="button" aria-label="Log out">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9" />
          </svg><span class="lbl">Log out</span>
        </button>
      </div>
    </header>

    <main class="messages" id="messages" role="log" aria-live="polite"></main>

    <div class="composer">
      <button class="pill small jump" id="jump" type="button" hidden>&darr; Latest</button>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Message the assistant" aria-label="Message"
          enterkeyhint="enter"></textarea>
        <button class="orb mic" id="mic" type="button" aria-label="Voice input" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
          </svg>
        </button>
        <button class="orb" id="send" type="submit" aria-label="Send message">
          <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7" />
          </svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2.5" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="/assets/chat.js?v=3"></script>
</body>

</html>
